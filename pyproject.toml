[project]
name = "mogen-brca"
version = "0.1.0"
description = "MOGEN-BRCA: multi-omic gene-expression and clinical fusion for TCGA-BRCA subtype, receptor-status and survival prediction"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "tqdm>=4.68.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
